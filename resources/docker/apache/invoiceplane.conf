<VirtualHost *:80>
    ServerName invoiceplane.local
    ServerAdmin admin@invoiceplane.local

    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            # Deny access to application code, dependencies and private files
            RewriteRule ^(application|vendor|storage|resources|node_modules|tests|\.github)(/|$) - [R=404,L]
            RewriteRule (^|/)\.(?!well-known/) - [R=404,L]
            RewriteRule ^(composer\.(json|lock)|package\.json|yarn\.lock|Gruntfile\.js|ipconfig\.php(\.example)?|htaccess|phpunit\.xml|pint\.json|phpstan\.neon|rector\.php|[^/]+\.md)$ - [R=404,L]

            # Route all requests through index.php (except for actual files/directories)
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ /index.php?/$1 [QSA,L]
        </IfModule>
    </Directory>

    # Protect uploads subdirectories with .htaccess
    <Directory /var/www/html/uploads/archive>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/customer_files>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/import>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/temp>
        Require all denied
    </Directory>

    # storage/ holds session data, logs, cache, and temporary invoice XML
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    # Allow ACME challenges for Let's Encrypt
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # Disable PHP execution in upload directories
    <FilesMatch "\.php$">
        <Directory /var/www/html/uploads>
            Require all denied
        </Directory>
    </FilesMatch>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    </IfModule>

    ErrorLog /var/log/apache2/invoiceplane_error.log
    CustomLog /var/log/apache2/invoiceplane_access.log combined
</VirtualHost>
