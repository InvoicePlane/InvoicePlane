<VirtualHost *:80>
    ServerName invoiceplane.local
    ServerAdmin admin@invoiceplane.local

    # Serve from the public/ web root — only public/index.php is exposed; the
    # application, bootstrap, vendor, storage and uploads trees stay above it.
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /

            RewriteRule (^|/)\.(?!well-known/) - [R=404,L]

            # Route all requests through index.php (except for actual files/directories)
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule ^(.*)$ /index.php?/$1 [QSA,L]
        </IfModule>
    </Directory>

    # Application code, dependencies and private data live above public/ and are
    # never served directly, but deny them explicitly too — belt and suspenders,
    # same as the nginx config, in case of a stray symlink or Alias.
    <Directory ~ "/var/www/html/(application|vendor|storage|resources|node_modules|tests|\.github)">
        Require all denied
    </Directory>

    # Protect uploads subdirectories with .htaccess
    <Directory /var/www/html/uploads/archive>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/customer_files>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/import>
        Require all denied
    </Directory>

    <Directory /var/www/html/uploads/temp>
        Require all denied
    </Directory>

    # storage/ holds session data, logs, cache, and temporary invoice XML
    <Directory /var/www/html/storage>
        Require all denied
    </Directory>

    # Allow ACME challenges for Let's Encrypt — served from a dedicated root
    # outside public/, matching the nginx config (not /var/www/html/.well-known,
    # which is no longer under DocumentRoot).
    Alias /.well-known/acme-challenge /var/www/letsencrypt/.well-known/acme-challenge
    <Directory /var/www/letsencrypt/.well-known/acme-challenge>
        Require all granted
    </Directory>

    # Disable PHP execution in upload directories
    <FilesMatch "\.php$">
        <Directory /var/www/html/uploads>
            Require all denied
        </Directory>
    </FilesMatch>

    # Security headers
    <IfModule mod_headers.c>
        Header always set X-Frame-Options "SAMEORIGIN"
        Header always set X-Content-Type-Options "nosniff"
        Header always set Referrer-Policy "strict-origin-when-cross-origin"
        Header always set Content-Security-Policy "frame-ancestors 'self'; object-src 'none'; base-uri 'self'"
    </IfModule>

    ErrorLog /var/log/apache2/invoiceplane_error.log
    CustomLog /var/log/apache2/invoiceplane_access.log combined
</VirtualHost>
