server {

    listen 80;

    server_name ivpl.local;
    root /var/www/projects/invoiceplane;
    index index.php index.html index.htm;

    # Never serve private folders, dot files, project files or configuration backups: nginx does not
    # read .htaccess, and "location /" below serves every file that exists. htaccess (Apache) and
    # web.config (IIS) carry the same refusals; keep the three in step. These blocks must stay above
    # "location ~ \.php$": regex locations are tried in the order they are written.
    location ~* ^/+(application|vendor|storage|resources|node_modules|tests|uploads/+(archive|customer_files|import|temp))(/|$) {
        return 404;
    }

    location ~ (^|/)\.(?!well-known(/|$)) {
        return 404;
    }

    location ~* ^/+(composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|[^/]+\.md|phpcs\.xml|phpunit\.xml|phpstan[^/]*|pint\.json|rector\.php|Gruntfile\.js|(docker-)?compose\.yml|crowdin\.yml|Dockerfile|Makefile|playwright\.config\.js|htaccess|web\.config|ipconfig\.php[^/]*|LICENSE\.txt)$ {
        return 404;
    }

    # The front controller is the one PHP file that is reachable
    location ~* ^/+(?!index\.php(/|$)).*\.php(/|$) {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=none";
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fixes timeouts
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    # storage/ holds session data, logs, cache, and temporary SUMEX invoice XML
    # (patient PII); nginx does not honor .htaccess, so deny it explicitly here.
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    # uploads/ subdirectories contain sensitive financial data (import CSVs, archived invoices);
    # nginx does not honor .htaccess, so deny them explicitly here.
    location ^~ /uploads/customer_files/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/archive/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/import/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/temp/ {
        deny all;
        return 404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/ivpl_error.log;
    access_log /var/log/nginx/ivpl_access.log;
}
