# Default server - handles requests via IP address (for E2E tests)
server {
    listen 80 default_server;
    server_name _;
    root /var/www/projects/invoiceplane/ivpl-devcheck/public;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
    }

    location ~ \.php$ {
        try_files $uri /index.php =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fixes timeouts
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }

    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/customer_files/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/archive/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/import/ {
        deny all;
        return 404;
    }

    location ^~ /uploads/temp/ {
        deny all;
        return 404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/ivpl_error.log;
    access_log /var/log/nginx/ivpl_access.log;
}

