server {

    listen 80;

    server_name ivpl.local;
    root /var/www/projects/invoiceplane;
    index index.php index.html index.htm;

    location / {
        try_files $uri $uri/ /index.php$is_args$args;
        proxy_cookie_path / "/; HTTPOnly; Secure; SameSite=none";
    }

    # Application code, dependencies and private data are never served or executed directly.
    # nginx does not honour the .htaccess files that protect these paths on Apache: without these
    # rules archived invoice PDFs (uploads/archive, predictable file names), customer attachments,
    # import CSVs and vendor/ scripts were all reachable without logging in.
    location ~ ^/(application|vendor|storage|resources|node_modules|tests|\.github)(/|$) {
        return 404;
    }

    location ~ ^/uploads/(archive|customer_files|import|temp)(/|$) {
        return 404;
    }

    # Dotfiles (.git, .env, .htaccess ...) except ACME challenges
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location ~ ^/(composer\.(json|lock)|package\.json|yarn\.lock|Gruntfile\.js|ipconfig\.php(\.example)?|htaccess|phpunit\.xml|pint\.json|phpstan\.neon|rector\.php|[^/]+\.md)$ {
        return 404;
    }

    # index.php is the only PHP entry point; every other .php file is refused.
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass php-upstream;
        fastcgi_index index.php;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        #fixes timeouts
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }

    location ~ \.php$ {
        return 404;
    }

    # storage/ holds session data, logs, cache, and temporary SUMEX invoice XML
    # (patient PII); nginx does not honor .htaccess, so deny it explicitly here.
    location ^~ /storage/ {
        deny all;
        return 404;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt/;
        log_not_found off;
    }

    error_log /var/log/nginx/ivpl_error.log;
    access_log /var/log/nginx/ivpl_access.log;
}
