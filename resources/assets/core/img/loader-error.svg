<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#dc3545" stroke-width="3"/>
  
  <!-- Inner alert/exclamation mark -->
  <g fill="#dc3545">
    <!-- Exclamation stem -->
    <rect x="46" y="25" width="8" height="35" rx="2"/>
    <!-- Exclamation dot -->
    <circle cx="50" cy="70" r="5"/>
  </g>
  
  <!-- Optional pulse animation -->
  <circle cx="50" cy="50" r="45" fill="none" stroke="#dc3545" stroke-width="2" opacity="0.5">
    <animate attributeName="r" from="45" to="48" dur="1.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" from="0.5" to="0" dur="1.5s" repeatCount="indefinite"/>
  </circle>
</svg>