name: 'Setup PHP with Composer Caching'
description: 'Set up PHP environment and install Composer dependencies with intelligent caching'
inputs:
  php-version:
    description: 'PHP version to use'
    required: false
    default: '8.2'
  php-extensions:
    description: 'PHP extensions to install (comma-separated)'
    required: false
    default: 'mbstring, xml, ctype, json, fileinfo, pdo, sqlite, mysql, bcmath'
  composer-flags:
    description: 'Flags appended to the composer install command (e.g., --no-dev --optimize-autoloader). Used only when composer-args is empty.'
    required: false
    default: '--no-interaction --prefer-dist --optimize-autoloader'
  composer-args:
    description: 'Complete argument list passed directly to composer install. When non-empty, this overrides composer-flags and is used as-is.'
    required: false
    default: ''
  working-directory:
    description: 'Working directory for composer commands'
    required: false
    default: '.'

runs:
  using: 'composite'
  steps:
    - name: Set up PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: ${{ inputs.php-extensions }}
        coverage: none

    - name: Get Composer Cache Directory
      id: composer-cache
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Resolve composer.lock path
      id: composer-lock
      shell: bash
      run: |
        wd="${{ inputs.working-directory }}"
        if [ -z "$wd" ] || [ "$wd" = "." ]; then
          echo "lockfile=composer.lock" >> "$GITHUB_OUTPUT"
        else
          wd="${wd%/}"
          echo "lockfile=${wd}/composer.lock" >> "$GITHUB_OUTPUT"
        fi

    - name: Cache Composer dependencies
      uses: actions/cache@v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles(steps.composer-lock.outputs.lockfile) }}
        restore-keys: |
          ${{ runner.os }}-composer-

    - name: Install Composer dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        set -euo pipefail
        COMPOSER_ARGS_INPUT="${{ inputs.composer-args }}"
        COMPOSER_FLAGS_INPUT="${{ inputs.composer-flags }}"
        export COMPOSER_ARGS_INPUT COMPOSER_FLAGS_INPUT

        if [ -n "$COMPOSER_ARGS_INPUT" ]; then
          set -o noglob
          mapfile -t composer_args < <(python - <<'PY'
import os, shlex, sys
raw = os.environ.get('COMPOSER_ARGS_INPUT', '')
try:
    parts = shlex.split(raw)
except ValueError as exc:
    print(f"Invalid composer-args '{raw}': {exc}", file=sys.stderr)
    sys.exit(1)
for part in parts:
    print(part)
PY
)
          set +o noglob
          composer install "${composer_args[@]}"
        else
          set -o noglob
          mapfile -t composer_flags < <(python - <<'PY'
import os, shlex, sys
raw = os.environ.get('COMPOSER_FLAGS_INPUT', '')
try:
    parts = shlex.split(raw)
except ValueError as exc:
    print(f"Invalid composer-flags '{raw}': {exc}", file=sys.stderr)
    sys.exit(1)
for part in parts:
    print(part)
PY
)
          set +o noglob
          composer install "${composer_flags[@]}"
        fi
