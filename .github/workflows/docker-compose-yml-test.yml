name: docker-compose.yml Check

# Builds and smoke-tests docker-compose.yml — the separated dev services setup
# (php-fpm, nginx, mariadb, phpmyadmin) that bind-mounts the working tree and
# expects composer/yarn to have already run locally — the classic
# pre-Containerfile dev setup. ipconfig.php is generated automatically by
# dev-entrypoint.sh from the environment variables baked into docker-compose.yml
# (this job intentionally does NOT pre-create it, so it also exercises that
# generation path). "Smoke-tested" means: it builds, the containers come up
# and stay up, and the web server responds to an HTTP request (even the setup
# wizard counts) — this is not a full functional/install test.
#
# nginx/invoiceplane.conf sets server_name ivpl.local, so this needs an
# /etc/hosts entry to resolve — see resources/docker/README.md.

on:
  push:
    branches: [develop]
    paths:
      - 'docker-compose.yml'
      - 'resources/docker/php-fpm/**'
      - 'resources/docker/nginx/**'
      - 'resources/docker/mariadb/**'
      - 'resources/docker/phpmyadmin/**'
      - 'ipconfig.php.example'
      - '.github/workflows/docker-compose-yml-test.yml'
  pull_request:
    paths:
      - 'docker-compose.yml'
      - 'resources/docker/php-fpm/**'
      - 'resources/docker/nginx/**'
      - 'resources/docker/mariadb/**'
      - 'resources/docker/phpmyadmin/**'
      - 'ipconfig.php.example'
      - '.github/workflows/docker-compose-yml-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docker-compose-yml:
    name: docker-compose.yml (separated dev services)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Set up PHP 8.2 and install the Composer dependencies
        uses: ./.github/actions/setup-php-composer
        with:
          php-version: '8.2'
          php-extensions: gd, bcmath, intl, xml, zip, mbstring, pdo_mysql, curl

      - name: Install JS dependencies and build assets
        run: |
          yarn install --frozen-lockfile
          yarn build

      - name: Add ivpl.local to /etc/hosts
        run: echo "127.0.0.1 ivpl.local" | sudo tee -a /etc/hosts

      - name: Build and start containers
        run: docker compose -f docker-compose.yml up -d --build

      - name: Wait for the app to respond
        run: |
          set -e
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -H "Host: ivpl.local" "http://ivpl.local/"; then
              echo "App responded after ${i}0s"
              exit 0
            fi
            echo "Waiting for app... (${i}0s)"
            sleep 10
          done
          echo "ERROR: app never responded on http://ivpl.local/"
          exit 1

      - name: Show container status
        if: always()
        run: docker compose -f docker-compose.yml ps

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml down -v
