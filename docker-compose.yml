---
# Explicit project name. Without one, Compose derives it from the directory, which
# this repo's two compose files then SHARE -- and because both declare a volume
# called `invoiceplane-db`, they resolve to the same `<dir>_invoiceplane-db`.
# Whichever stack starts first initialises the database, and the other one is left
# with credentials that were never created: MariaDB only seeds MARIADB_USER /
# MARIADB_DATABASE on an empty data directory, so the second stack fails with
# "Access denied for user 'ipdevdb'" even though the network is fine. Naming this
# project separates its volumes and network from compose.yml's for good.
#
# compose.yml  -> self-contained production-style image, port 4895
# this file    -> development stack, bind-mounts the working tree, port 80
#                 docker compose -f docker-compose.yml up -d
name: invoiceplane-dev

networks:
  invoiceplane:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.25.0.0/17

volumes:
  invoiceplane-db:
    driver: "local"
  nginx_logs:
    driver: "local"

services:
  # --- PHP (8.4 by default; 8.2, 8.3 and 8.5 are also supported)
  php:
    container_name: "invoiceplane-php"
    build:
      context: ./resources/docker/php-fpm
      args:
        - PHP_VERSION=8.4
        - PUID=1000
        - PGID=1000
        - TZ=UTC
    links:
      - db
    expose:
      - "9000"
    dns: 8.8.8.8
    depends_on:
      - db
    networks:
      invoiceplane:
        ipv4_address: 172.25.0.11
    environment:
      # Used by dev-entrypoint.sh only to generate ipconfig.php on first run —
      # if ipconfig.php already exists, these are ignored and it's left alone.
      IP_URL: http://ivpl.local
      DB_HOSTNAME: db
      DB_USERNAME: ipdevdb
      DB_PASSWORD: ipdevdb
      DB_DATABASE: invoiceplane_db
      ENCRYPTION_KEY: dev-key-change-me-in-production-00
    volumes:
      - .:/var/www/projects/invoiceplane:delegated
      - ./resources/docker/php-fpm/php-dev.ini:/usr/local/etc/php/php.ini

  # --- nginx 1.23
  nginx:
    container_name: "invoiceplane-nginx"
    build:
      context: ./resources/docker/nginx
    links:
      - php
    ports:
      - "80:80"
    dns: 8.8.8.8
    depends_on:
      - php
    networks:
      invoiceplane:
        ipv4_address: 172.25.0.12
    volumes:
      - .:/var/www/projects/invoiceplane:delegated
      - nginx_logs:/var/log/nginx
      - ./resources/docker/nginx/invoiceplane.conf:/etc/nginx/conf.d/invoiceplane.conf:ro

  # --- Mailpit (SMTP catcher)
  # Belt and braces with EMAIL_OVERRIDE_TO in ipconfig.php: that redirects every
  # message to one address, and this makes sure the message cannot leave the
  # machine at all. Mailpit accepts SMTP on 1025 and never relays onward; read
  # what was "sent" at http://localhost:8025. Point the app at it with
  # Settings > Email: method SMTP, server "mailpit", port 1025, no auth.
  mailpit:
    container_name: "invoiceplane-mailpit"
    image: axllent/mailpit:latest
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      # Loopback only: the UI has no authentication and shows every caught message.
      - "127.0.0.1:8025:8025"
    networks:
      invoiceplane:
        ipv4_address: 172.25.0.14

  # --- MariaDB 10.9
  db:
    container_name: "invoiceplane-db"
    build:
      context: ./resources/docker/mariadb
    environment:
      - MARIADB_ROOT_PASSWORD=ipdevdb
      - MARIADB_USER=ipdevdb
      - MARIADB_PASSWORD=ipdevdb
      - MARIADB_DATABASE=invoiceplane_db
    networks:
      invoiceplane:
        ipv4_address: 172.25.0.13
    volumes:
      - "invoiceplane-db:/var/lib/mysql"

  phpmyadmin:
    container_name: "invoiceplane-dbadmin"
    build:
      context: ./resources/docker/phpmyadmin
    environment:
      - PMA_HOST=invoiceplane-db
      #- PMA_USER=root
      #- PMA_PASSWORD=ipdevdb
      #- PMA_ROOT_PASSWORD=ipdevdb
      - MYSQL_DATABASE=invoiceplane_db
      - MYSQL_USER=ipdevdb
      - MYSQL_PASSWORD=ipdevdb
      - MYSQL_ROOT_PASSWORD=ipdevdb
      - MAX_EXECUTION_TIME=600
      - MEMORY_LIMIT=256M
      - UPLOAD_LIMIT=2G
    depends_on:
      - db
    links:
      - db
    restart: always
    volumes:
      - ./resources/docker/phpmyadmin/config.user.inc.php:/etc/phpmyadmin/config.user.inc.php
      - ./resources/docker/databases:/var/www/html/tmp/upload_databases
    ports:
      - "8081:80"
    networks:
      invoiceplane:
        ipv4_address: 172.25.0.16
